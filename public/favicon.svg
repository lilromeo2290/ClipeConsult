<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background: transparent (will show page bg) -->

  <!-- Gear teeth (navy) -->
  <g fill="#1B2A5C">
    <rect x="46" y="4" width="8" height="9" rx="1.5"/>
    <rect x="46" y="87" width="8" height="9" rx="1.5"/>
    <rect x="4" y="46" width="9" height="8" rx="1.5"/>
    <rect x="87" y="46" width="9" height="8" rx="1.5"/>
    <rect x="13" y="13" width="9" height="9" rx="1.5" transform="rotate(45 17.5 17.5)"/>
    <rect x="78" y="13" width="9" height="9" rx="1.5" transform="rotate(-45 82.5 17.5)"/>
    <rect x="13" y="78" width="9" height="9" rx="1.5" transform="rotate(-45 17.5 82.5)"/>
    <rect x="78" y="78" width="9" height="9" rx="1.5" transform="rotate(45 82.5 82.5)"/>
  </g>

  <!-- Gear arcs (navy, partial 270° ring forming "C" shape open on right) -->
  <path d="M 50 12 A 38 38 0 1 0 50 88" fill="none" stroke="#1B2A5C" stroke-width="9" stroke-linecap="round"/>

  <!-- Three buildings (centered cluster) -->
  <!-- Left building (navy, medium-tall) with vertical white slit -->
  <rect x="32" y="34" width="9" height="42" fill="#1B2A5C"/>
  <rect x="35.5" y="38" width="2" height="34" fill="#FFFFFF"/>

  <!-- Center building (red, tallest) -->
  <polygon points="43,24 53,24 53,76 43,76" fill="#E31E24"/>
  <rect x="45" y="28" width="2" height="6" fill="#FFFFFF"/>

  <!-- Right building (red, shorter, angled top) -->
  <polygon points="55,40 65,38 65,76 55,76" fill="#E31E24"/>

  <!-- Wing/chevron accent at bottom-right (red on top, navy beneath) -->
  <path d="M 50 78 L 88 78 L 88 84 L 50 84 Z" fill="#1B2A5C"/>
  <path d="M 50 73 L 92 73 L 92 79 L 50 79 Z" fill="#E31E24"/>

  <!-- Vertical line on far right (navy) -->
  <rect x="93" y="14" width="3" height="72" rx="1" fill="#1B2A5C"/>
</svg>
