<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Navy background rounded square -->
  <rect width="64" height="64" rx="12" fill="#1B2A5C"/>

  <!-- Gear teeth (lighter navy ring) -->
  <g fill="#2A3D75">
    <rect x="29" y="6" width="6" height="6" rx="1"/>
    <rect x="29" y="52" width="6" height="6" rx="1"/>
    <rect x="6" y="29" width="6" height="6" rx="1"/>
    <rect x="52" y="29" width="6" height="6" rx="1"/>
    <rect x="13" y="13" width="6" height="6" rx="1" transform="rotate(45 16 16)"/>
    <rect x="45" y="13" width="6" height="6" rx="1" transform="rotate(-45 48 16)"/>
    <rect x="13" y="45" width="6" height="6" rx="1" transform="rotate(-45 16 48)"/>
    <rect x="45" y="45" width="6" height="6" rx="1" transform="rotate(45 48 48)"/>
  </g>

  <!-- Center building (red, tallest) -->
  <polygon points="32,16 38,20 38,46 26,46 26,20" fill="#E31E24"/>

  <!-- Right building (red, medium) -->
  <polygon points="40,24 46,27 46,46 40,46" fill="#E31E24"/>

  <!-- Left building (white, shorter) -->
  <polygon points="18,28 24,30 24,46 18,46" fill="#FFFFFF"/>

  <!-- Curved swoosh base -->
  <path d="M 10 48 Q 32 56 54 48" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
</svg>
