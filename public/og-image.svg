<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#0056D2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A90E2"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="980" cy="120" r="280" fill="rgba(74,144,226,0.18)"/>
  <circle cx="180" cy="520" r="200" fill="rgba(0,86,210,0.25)"/>

  <!-- Logo mark -->
  <g transform="translate(96, 96)">
    <rect width="80" height="80" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)"/>
    <path d="M24 22 L24 58 L56 58" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="56" cy="22" r="4" fill="#4A90E2"/>
    <circle cx="56" cy="58" r="4" fill="#FFFFFF"/>
  </g>
  <text x="196" y="148" font-family="Poppins, Inter, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">Clipe Consult</text>
  <text x="196" y="180" font-family="Inter, sans-serif" font-size="20" fill="rgba(255,255,255,0.7)">IT Consulting • Ghana</text>

