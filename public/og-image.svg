  <text x="96" y="392" font-family="Poppins, sans-serif" font-size="64" font-weight="800" fill="url(#accent)">Through Innovative IT</text>

  <text x="96" y="448" font-family="Inter, sans-serif" font-size="26" fill="rgba(255,255,255,0.85)">Website Design • Software Development • IT Support • Hosting • Networks • Training</text>

  <g transform="translate(96, 510)">
    <rect width="280" height="60" rx="30" fill="#0056D2"/>
    <text x="140" y="38" font-family="Poppins, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">Get Free Consultation</text>
  </g>
  <text x="404" y="548" font-family="Inter, sans-serif" font-size="20" fill="rgba(255,255,255,0.85)">www.clipeconsult.com</text>
