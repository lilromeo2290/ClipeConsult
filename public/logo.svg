<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" font-family="Poppins, Arial, sans-serif">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2A5C"/>
      <stop offset="1" stop-color="#0F1F4A"/>
    </linearGradient>
  </defs>

  <!-- Icon: gear + buildings -->
  <g transform="translate(8, 8)">
    <!-- Outer rounded square (navy) -->
    <rect width="64" height="64" rx="14" fill="url(#navy)"/>

    <!-- Gear ring -->
    <g fill="#2A3D75">
      <rect x="29" y="4" width="6" height="6" rx="1.2"/>
      <rect x="29" y="54" width="6" height="6" rx="1.2"/>
      <rect x="4" y="29" width="6" height="6" rx="1.2"/>
      <rect x="54" y="29" width="6" height="6" rx="1.2"/>
      <rect x="11" y="11" width="6" height="6" rx="1.2" transform="rotate(45 14 14)"/>
      <rect x="47" y="11" width="6" height="6" rx="1.2" transform="rotate(-45 50 14)"/>
      <rect x="11" y="47" width="6" height="6" rx="1.2" transform="rotate(-45 14 50)"/>
      <rect x="47" y="47" width="6" height="6" rx="1.2" transform="rotate(45 50 50)"/>
    </g>

    <!-- Center building (red, tallest) -->
    <polygon points="32,14 39,18 39,50 25,50 25,18" fill="#E31E24"/>
    <!-- Right building (red, medium) -->
    <polygon points="41,22 47,25 47,50 41,50" fill="#E31E24"/>
    <!-- Left building (white, shorter) -->
    <polygon points="17,26 23,28 23,50 17,50" fill="#FFFFFF"/>

    <!-- Curved swoosh base -->
    <path d="M 9 52 Q 32 60 55 52" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Vertical divider -->
  <line x1="86" y1="14" x2="86" y2="66" stroke="#1B2A5C" stroke-width="1.5" opacity="0.25"/>

  <!-- Text: CLIPE -->
  <text x="98" y="34" font-size="24" font-weight="800" fill="#1B2A5C" letter-spacing="1.5">CLIPE</text>
  <!-- Text: CONSULT (red) -->
  <text x="98" y="56" font-size="14" font-weight="700" fill="#E31E24" letter-spacing="3.5">CONSULT</text>

  <!-- Tagline -->
  <text x="178" y="34" font-size="7" font-weight="500" fill="#1B2A5C" letter-spacing="0.4">Building Innovations</text>
  <text x="178" y="34" font-size="7" font-weight="700" fill="#E31E24"> | </text>
  <text x="178" y="34" font-size="7" font-weight="500" fill="#1B2A5C" letter-spacing="0.4"><tspan dx="34">Engineering Excellence</tspan></text>

  <!-- Decorative underlines -->
  <line x1="178" y1="40" x2="206" y2="40" stroke="#1B2A5C" stroke-width="0.8"/>
  <line x1="208" y1="40" x2="216" y2="40" stroke="#E31E24" stroke-width="0.8"/>
  <line x1="218" y1="40" x2="290" y2="40" stroke="#1B2A5C" stroke-width="0.8"/>

  <!-- Tagline text continues below -->
  <text x="98" y="70" font-size="6.5" font-weight="500" fill="#1B2A5C" letter-spacing="0.5">Building Innovations <tspan fill="#E31E24" font-weight="700">|</tspan> Engineering Excellence</text>
</svg>
